<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FluxoCash Pro • Diário • Gerenciador Financeiro</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- React & ReactDOM via CDN -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    
    <!-- Babel para compilar o JSX no navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.3/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #e4e4e7; -webkit-tap-highlight-color: transparent; }
        /* Scrollbar customizada */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Extraindo Hooks do React global
        const { useState, useEffect, useMemo } = React;

        // ================== SUPABASE INIT ==================
        const supabaseUrl = 'https://jcglrkaaitybbddbseim.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjZ2xya2FhaXR5YmJkZGJzZWltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk4MDAxODMsImV4cCI6MjA3NTM3NjE4M30.tsOa3A2XplHjcVLIJqI9rqCoYoZ_PDFLAgndFem_tOs';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // ================== UTILS ==================
        const formatCurrency = (v) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v || 0);
        const formatDate = (d) => {
            if (!d) return '';
            const dateStr = d.includes('T') ? d : `${d}T12:00:00Z`;
            return new Date(dateStr).toLocaleDateString('pt-BR');
        };
        const getMonday = (d) => {
            const date = new Date(d);
            const day = date.getDay();
            const diff = date.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(date.setDate(diff));
        };
        const getTodayStr = () => new Date().toISOString().split('T')[0];

        // ================== COMPONENTES AUXILIARES ==================
        const LoadingOverlay = () => (
            <div className="fixed inset-0 bg-black/80 flex flex-col items-center justify-center z-[300] animate-[fadeIn_0.2s_ease-out]">
                <i className="fa-solid fa-circle-notch fa-spin text-emerald-500 mb-4 text-5xl"></i>
                <p className="font-bold text-lg text-white">Processando...</p>
            </div>
        );

        const ModalAlert = ({ alertConfig, closeAlert }) => {
            if (!alertConfig.show) return null;
            return (
                <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[400] p-4">
                    <div className="bg-zinc-900 p-6 md:p-8 rounded-3xl w-full max-w-sm text-center border border-zinc-700 shadow-2xl">
                        <div className="w-16 h-16 bg-zinc-800 rounded-full flex items-center justify-center mx-auto mb-4 text-emerald-400 text-3xl">
                            <i className="fa-solid fa-bell"></i>
                        </div>
                        <p className="text-zinc-200 mb-8 text-lg font-medium">{alertConfig.msg}</p>
                        <button onClick={closeAlert} className="w-full bg-emerald-500 hover:bg-emerald-600 py-4 rounded-2xl font-bold transition shadow-lg shadow-emerald-500/20">OK, Entendi</button>
                    </div>
                </div>
            );
        };

        const ModalConfirm = ({ confirmConfig, closeConfirm }) => {
            if (!confirmConfig.show) return null;
            return (
                <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[400] p-4">
                    <div className="bg-zinc-900 p-6 md:p-8 rounded-3xl w-full max-w-sm text-center border border-zinc-700 shadow-2xl">
                        <div className="w-16 h-16 bg-red-500/10 rounded-full flex items-center justify-center mx-auto mb-4 text-red-500 text-3xl">
                            <i className="fa-solid fa-triangle-exclamation"></i>
                        </div>
                        <p className="text-zinc-200 mb-8 text-lg font-medium">{confirmConfig.msg}</p>
                        <div className="flex flex-col md:flex-row gap-3 justify-center">
                            <button onClick={() => { closeConfirm(); confirmConfig.onConfirm(false); }} className="flex-1 bg-zinc-800 hover:bg-zinc-700 py-4 rounded-2xl font-bold transition order-2 md:order-1">Cancelar</button>
                            <button onClick={() => { closeConfirm(); confirmConfig.onConfirm(true); }} className="flex-1 bg-red-500 hover:bg-red-600 py-4 rounded-2xl font-bold transition shadow-lg shadow-red-500/20 order-1 md:order-2">Confirmar</button>
                        </div>
                    </div>
                </div>
            );
        };

        // ================== APLICATIVO PRINCIPAL ==================
        const App = () => {
            // State
            const [user, setUser] = useState(null);
            const [isLoginMode, setIsLoginMode] = useState(true);
            const [activeSection, setActiveSection] = useState('dashboard');
            const [loading, setLoading] = useState(false);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            
            // Data
            const [transactions, setTransactions] = useState([]);
            const [bills, setBills] = useState([]);
            const [employees, setEmployees] = useState([]);
            const [attendances, setAttendances] = useState([]);

            // Modals & Forms
            const [alertConfig, setAlertConfig] = useState({ show: false, msg: '' });
            const [confirmConfig, setConfirmConfig] = useState({ show: false, msg: '', onConfirm: null });
            const [modalType, setModalType] = useState(null); 

            // Form Inputs
            const [authForm, setAuthForm] = useState({ nome: '', email: '', senha: '' });
            const [transForm, setTransForm] = useState({ tipo: 'entrada', data: getTodayStr(), desc: '', valor: '' });
            const [contaForm, setContaForm] = useState({ desc: '', valor: '', vencimento: getTodayStr() });
            const [funcForm, setFuncForm] = useState({ nome: '', cargo: '', salario: '', data_nascimento: '', cpf: '', endereco: '', telefone: '', dados_bancarios: '' });
            const [freqForm, setFreqForm] = useState({ funcionario_id: '', data: getTodayStr(), presente: false });
            const [pagInicio, setPagInicio] = useState(getMonday(new Date()).toISOString().split('T')[0]);
            const [relatorioForm, setRelatorioForm] = useState({ inicio: '', fim: '' });
            const [pagamentosTemp, setPagamentosTemp] = useState([]);
            
            // State para o Painel de Admin
            const [systemUsers, setSystemUsers] = useState([]);

            const showAlert = (msg) => setAlertConfig({ show: true, msg });
            const showConfirm = (msg, onConfirm) => setConfirmConfig({ show: true, msg, onConfirm });

            // Tratar navegação no mobile
            const handleNavigate = (sectionId) => {
                setActiveSection(sectionId);
                setIsMobileMenuOpen(false);
            };

            // ================== DATA FETCHING ==================
            const loadData = async () => {
                setLoading(true);
                try {
                    const [resTrans, resBills, resEmp, resAtt] = await Promise.all([
                        supabase.from('transacoes').select('*').order('data', { ascending: false }),
                        supabase.from('contas_pagar').select('*').order('vencimento', { ascending: true }),
                        supabase.from('funcionarios').select('*').order('nome', { ascending: true }),
                        supabase.from('frequencias').select('*').order('data', { ascending: false })
                    ]);

                    if (resTrans.error) console.error(resTrans.error);

                    setTransactions(resTrans.data || []);
                    setBills(resBills.data || []);
                    setEmployees(resEmp.data || []);
                    setAttendances(resAtt.data || []);
                } catch (err) {
                    showAlert('Erro de comunicação: ' + err.message);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                if (user) loadData();
            }, [user]);

            useEffect(() => {
                if (activeSection === 'usuarios' && user?.is_admin) {
                    loadSystemUsers();
                }
            }, [activeSection]);

            const loadSystemUsers = async () => {
                setLoading(true);
                const { data, error } = await supabase.from('usuarios').select('*').order('nome');
                if (!error && data) setSystemUsers(data);
                setLoading(false);
            };

            const toggleUserApproval = async (id, currentStatus) => {
                setLoading(true);
                const { error } = await supabase.from('usuarios').update({ aprovado: !currentStatus }).eq('id', id);
                setLoading(false);
                
                if (error) {
                    showAlert('Erro ao atualizar status: ' + error.message);
                } else {
                    setSystemUsers(systemUsers.map(u => u.id === id ? { ...u, aprovado: !currentStatus } : u));
                    showAlert(`Acesso ${!currentStatus ? 'liberado' : 'bloqueado'} com sucesso!`);
                }
            };

            // ================== AUTH ==================
            const handleAuth = async (e) => {
                e.preventDefault();
                setLoading(true);
                const { email, senha, nome } = authForm;

                if (isLoginMode) {
                    const { data, error } = await supabase.from('usuarios').select('*').eq('email', email).eq('senha', senha).single();
                    if (data) {
                        if (data.aprovado === false) {
                            showAlert('Sua conta está em análise. Aguarde a aprovação do administrador para acessar o sistema.');
                        } else {
                            setUser(data);
                        }
                    } else {
                        showAlert('Email ou senha incorretos.');
                    }
                } else {
                    const { data, error } = await supabase.from('usuarios').insert([{ nome, email, senha, aprovado: false }]).select().single();
                    if (error) {
                        showAlert('Erro ao criar conta. Email já em uso.');
                    } else {
                        showAlert('Conta criada com sucesso! Como medida de segurança, aguarde a aprovação do administrador para realizar o login.');
                        setIsLoginMode(true);
                        setAuthForm({...authForm, senha: ''});
                    }
                }
                setLoading(false);
            };

            const logout = () => {
                setUser(null);
                setAuthForm({ nome: '', email: '', senha: '' });
                setTransactions([]); setBills([]); setEmployees([]); setAttendances([]);
            };

            // ================== DASHBOARD CALCULATIONS ==================
            const dashboardStats = useMemo(() => {
                const entradas = transactions.filter(t => t.tipo === 'entrada').reduce((a, t) => a + t.valor, 0);
                const saidas = transactions.filter(t => t.tipo === 'saida').reduce((a, t) => a + t.valor, 0);
                const saldo = entradas - saidas;
                const pendentes = bills.filter(b => !b.pago).reduce((a, b) => a + b.valor, 0);
                return { entradas, saidas, saldo, pendentes };
            }, [transactions, bills]);

            const proximosPagamentos = useMemo(() => {
                const hoje = new Date();
                const proxSemana = new Date(hoje);
                proxSemana.setDate(proxSemana.getDate() + 7);
                
                return employees.map(emp => {
                    let count = 0;
                    for (let d = new Date(hoje); d <= proxSemana; d.setDate(d.getDate() + 1)) {
                        const dStr = d.toISOString().split('T')[0];
                        const reg = attendances.find(a => a.funcionario_id == emp.id && a.data === dStr);
                        if (reg && reg.presente) count++;
                    }
                    return { ...emp, dias: count, valor: emp.salario_diario * count };
                }).filter(e => e.valor > 0);
            }, [employees, attendances]);

            const chartData = useMemo(() => {
                const data = [];
                const hoje = new Date();
                let maxVal = 0;
                
                for (let i = 29; i >= 0; i--) {
                    const d = new Date(hoje);
                    d.setDate(d.getDate() - i);
                    const diaStr = d.toISOString().split('T')[0];
                    
                    const ent = transactions.filter(t => t.data === diaStr && t.tipo === 'entrada').reduce((a,t)=>a+t.valor,0);
                    const sai = transactions.filter(t => t.data === diaStr && t.tipo === 'saida').reduce((a,t)=>a+t.valor,0);
                    
                    if (ent > maxVal) maxVal = ent;
                    if (sai > maxVal) maxVal = sai;
                    
                    data.push({ label: d.toLocaleDateString('pt-BR', {day:'numeric'}), ent, sai });
                }
                return { data, maxVal: maxVal > 0 ? maxVal : 1 };
            }, [transactions]);

            // ================== CRUD TRANSAÇÕES ==================
            const saveTransacao = async () => {
                const val = parseFloat(transForm.valor);
                if (isNaN(val) || !transForm.data) return showAlert('Preencha valor e data corretamente.');
                
                setLoading(true);
                const { data, error } = await supabase.from('transacoes').insert([{ 
                    data: transForm.data, tipo: transForm.tipo, descricao: transForm.desc || 'Sem descrição', valor: val 
                }]).select();
                
                setLoading(false);
                if (error) showAlert('Erro: ' + error.message);
                else {
                    setTransactions([data[0], ...transactions].sort((a,b) => b.data.localeCompare(a.data)));
                    setModalType(null);
                    setTransForm({ tipo: 'entrada', data: getTodayStr(), desc: '', valor: '' });
                }
            };

            const deleteTransacao = (id) => {
                showConfirm('Excluir transação permanentemente?', async () => {
                    setLoading(true);
                    const { error } = await supabase.from('transacoes').delete().eq('id', id);
                    setLoading(false);
                    if (error) showAlert('Erro: ' + error.message);
                    else setTransactions(transactions.filter(t => t.id !== id));
                });
            };

            // ================== CRUD CONTAS ==================
            const saveConta = async () => {
                const val = parseFloat(contaForm.valor);
                if (isNaN(val) || !contaForm.vencimento) return showAlert('Preencha valor e vencimento.');
                
                setLoading(true);
                const { data, error } = await supabase.from('contas_pagar').insert([{ 
                    descricao: contaForm.desc || 'Conta', valor: val, vencimento: contaForm.vencimento, pago: false 
                }]).select();
                
                setLoading(false);
                if (error) showAlert('Erro: ' + error.message);
                else {
                    setBills([...bills, data[0]].sort((a,b) => a.vencimento.localeCompare(b.vencimento)));
                    setModalType(null);
                    setContaForm({ desc: '', valor: '', vencimento: getTodayStr() });
                }
            };

            const payConta = (conta) => {
                showConfirm(`Deseja dar baixa em "${conta.descricao}" e registrar saída no Fluxo de Caixa?`, async () => {
                    const dataHoje = getTodayStr();
                    setLoading(true);
                    
                    const { error: errUpdate } = await supabase.from('contas_pagar').update({ pago: true, data_pagamento: dataHoje }).eq('id', conta.id);
                    if (errUpdate) {
                        setLoading(false);
                        return showAlert('Erro ao atualizar: ' + errUpdate.message);
                    }

                    const { data: transData, error: errTrans } = await supabase.from('transacoes').insert([{
                        data: dataHoje, tipo: 'saida', descricao: `Pagamento de conta: ${conta.descricao}`, valor: conta.valor
                    }]).select();

                    setLoading(false);
                    if (errTrans) {
                        showAlert('Erro ao inserir transação: ' + errTrans.message);
                    } else {
                        setBills(bills.map(b => b.id === conta.id ? { ...b, pago: true, data_pagamento: dataHoje } : b));
                        setTransactions([transData[0], ...transactions].sort((a,b) => b.data.localeCompare(a.data)));
                    }
                });
            };

            // ================== CRUD FUNCIONÁRIOS ==================
            const saveFuncionario = async () => {
                const val = parseFloat(funcForm.salario);
                if (!funcForm.nome || isNaN(val) || val <= 0) return showAlert('Nome e salário diário obrigatórios.');
                
                setLoading(true);
                const { data, error } = await supabase.from('funcionarios').insert([{ 
                    nome: funcForm.nome, 
                    cargo: funcForm.cargo || 'Funcionário', 
                    salario_diario: val,
                    data_nascimento: funcForm.data_nascimento || null,
                    cpf: funcForm.cpf || null,
                    endereco: funcForm.endereco || null,
                    telefone: funcForm.telefone || null,
                    dados_bancarios: funcForm.dados_bancarios || null
                }]).select();
                
                setLoading(false);
                if (error) showAlert('Erro: ' + error.message);
                else {
                    setEmployees([...employees, data[0]].sort((a,b) => a.nome.localeCompare(b.nome)));
                    setModalType(null);
                    setFuncForm({ nome: '', cargo: '', salario: '', data_nascimento: '', cpf: '', endereco: '', telefone: '', dados_bancarios: '' });
                }
            };

            const deleteFuncionario = (id) => {
                showConfirm('Excluir funcionário e seus registros?', async () => {
                    setLoading(true);
                    await supabase.from('frequencias').delete().eq('funcionario_id', id);
                    await supabase.from('pagamentos_semanais').delete().eq('funcionario_id', id);
                    const { error } = await supabase.from('funcionarios').delete().eq('id', id);
                    
                    if (error) showAlert('Erro: ' + error.message);
                    else {
                        setEmployees(employees.filter(e => e.id !== id));
                        setAttendances(attendances.filter(a => a.funcionario_id !== id));
                    }
                    setLoading(false);
                });
            };

            // ================== FREQUÊNCIA ==================
            const saveFrequencia = async () => {
                if (!freqForm.funcionario_id || !freqForm.data) return showAlert('Selecione funcionário e data.');
                
                setLoading(true);
                const exist = attendances.find(a => a.funcionario_id == freqForm.funcionario_id && a.data === freqForm.data);
                if (exist) await supabase.from('frequencias').delete().eq('id', exist.id);

                const { data, error } = await supabase.from('frequencias').insert([{ 
                    funcionario_id: freqForm.funcionario_id, data: freqForm.data, presente: freqForm.presente 
                }]).select();
                
                setLoading(false);
                if (error) showAlert('Erro: ' + error.message);
                else {
                    setAttendances([data[0], ...attendances.filter(a => a.id !== exist?.id)].sort((a,b) => b.data.localeCompare(a.data)));
                    showAlert('Frequência registrada!');
                }
            };

            const deleteFrequencia = (id) => {
                showConfirm('Excluir registro de frequência?', async () => {
                    setLoading(true);
                    const { error } = await supabase.from('frequencias').delete().eq('id', id);
                    setLoading(false);
                    if (error) showAlert('Erro: ' + error.message);
                    else setAttendances(attendances.filter(a => a.id !== id));
                });
            };

            // ================== PAGAMENTOS SEMANAIS ==================
            const handleCalcularPagamentos = () => {
                if (!pagInicio) return showAlert('Escolha a data de início.');
                const start = new Date(pagInicio);
                const end = new Date(start);
                end.setDate(end.getDate() + 6);
                
                const temps = employees.map(emp => {
                    let count = 0;
                    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                        const dStr = d.toISOString().split('T')[0];
                        const reg = attendances.find(a => a.funcionario_id == emp.id && a.data === dStr);
                        if (reg && reg.presente) count++;
                    }
                    return {
                        funcionario_id: emp.id,
                        nome: emp.nome,
                        dias: count,
                        valor: emp.salario_diario * count,
                        inicio: pagInicio,
                        fim: end.toISOString().split('T')[0]
                    };
                }).filter(p => p.valor > 0);
                
                setPagamentosTemp(temps);
            };

            const handleRegistrarPagamentos = () => {
                if (pagamentosTemp.length === 0) return showAlert('Nenhum pagamento calculado.');
                showConfirm('Registrar pagamentos como saídas no Fluxo de Caixa?', async () => {
                    setLoading(true);
                    const hoje = getTodayStr();
                    
                    for (const p of pagamentosTemp) {
                        await supabase.from('transacoes').insert([{
                            data: hoje, tipo: 'saida', descricao: `Pagamento: ${p.nome} (${formatDate(p.inicio)} a ${formatDate(p.fim)})`, valor: p.valor
                        }]);
                        await supabase.from('pagamentos_semanais').insert([{
                            funcionario_id: p.funcionario_id, semana_inicio: p.inicio, semana_fim: p.fim,
                            dias_trabalhados: p.dias, valor_pago: p.valor, data_registro: hoje
                        }]);
                    }
                    
                    await loadData();
                    setPagamentosTemp([]);
                    showAlert('Pagamentos registrados no fluxo!');
                });
            };

            // ================== TELA DE LOGIN ==================
            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        {loading && <LoadingOverlay />}
                        <ModalAlert alertConfig={alertConfig} closeAlert={() => setAlertConfig({show:false, msg:''})} />
                        
                        <div className="bg-zinc-900 p-6 md:p-8 rounded-3xl w-full max-w-sm border border-zinc-800 shadow-2xl">
                            <div className="flex items-center gap-3 mb-8 justify-center">
                                <div className="w-12 h-12 bg-emerald-500 rounded-2xl flex items-center justify-center text-white font-bold text-3xl">FC</div>
                                <h1 className="text-3xl font-bold tracking-tight">FluxoCash</h1>
                            </div>
                            
                            <h2 className="text-xl font-bold mb-6 text-center">{isLoginMode ? 'Acesse sua conta' : 'Crie sua conta'}</h2>
                            
                            <form onSubmit={handleAuth} className="space-y-4">
                                {!isLoginMode && (
                                    <input type="text" placeholder="Seu Nome Completo" required value={authForm.nome} onChange={e => setAuthForm({...authForm, nome: e.target.value})} className="w-full bg-zinc-800 border border-zinc-700 rounded-2xl p-4 outline-none focus:border-emerald-500 transition text-base" />
                                )}
                                <input type="email" placeholder="E-mail" required value={authForm.email} onChange={e => setAuthForm({...authForm, email: e.target.value})} className="w-full bg-zinc-800 border border-zinc-700 rounded-2xl p-4 outline-none focus:border-emerald-500 transition text-base" />
                                <input type="password" placeholder="Senha" required value={authForm.senha} onChange={e => setAuthForm({...authForm, senha: e.target.value})} className="w-full bg-zinc-800 border border-zinc-700 rounded-2xl p-4 outline-none focus:border-emerald-500 transition mb-2 text-base" />
                                
                                <button type="submit" className="w-full bg-emerald-500 hover:bg-emerald-600 py-4 rounded-2xl font-bold text-lg transition shadow-lg shadow-emerald-500/20 mt-2">
                                    {isLoginMode ? 'Entrar' : 'Cadastrar'}
                                </button>
                            </form>
                            
                            <p className="text-center text-sm text-zinc-400 mt-6">
                                {isLoginMode ? 'Não tem uma conta?' : 'Já tem uma conta?'}
                                <button onClick={() => setIsLoginMode(!isLoginMode)} type="button" className="text-emerald-400 font-bold ml-1 hover:text-emerald-300 transition">Clique aqui</button>
                            </p>
                        </div>
                    </div>
                );
            }

            // Filtro de Relatório
            const filteredRelatorios = transactions
                .filter(t => (!relatorioForm.inicio || t.data >= relatorioForm.inicio) && (!relatorioForm.fim || t.data <= relatorioForm.fim));
            const relEntradas = filteredRelatorios.filter(t => t.tipo === 'entrada').reduce((a, t) => a + t.valor, 0);
            const relSaidas = filteredRelatorios.filter(t => t.tipo === 'saida').reduce((a, t) => a + t.valor, 0);

                                <h2 className="text-2xl md:text-3xl font-bold mb-6 md:mb-8">Cálculo de Pagamentos Semanais</h2>
                                <div className="bg-zinc-900 rounded-3xl p-5 md:p-8 border border-zinc-800/50 shadow-xl">
                                    <div className="flex flex-col md:flex-row gap-4 md:gap-6 md:items-end">
                                        <div className="flex-1 w-full">
                                            <label className="block text-zinc-400 text-xs md:text-sm font-medium mb-2">Início da Semana (Segunda-feira)</label>
                                            <input type="date" value={pagInicio} onChange={e => setPagInicio(e.target.value)} className="w-full bg-zinc-800 border border-zinc-700 rounded-2xl p-4 outline-none focus:border-emerald-500 transition text-sm md:text-base" />
                                        </div>
                                        <button onClick={handleCalcularPagamentos} className="w-full md:w-auto bg-emerald-500 hover:bg-emerald-600 px-8 py-4 rounded-2xl font-bold transition shadow-lg shadow-emerald-500/20 text-sm md:text-base">
                                            Calcular Relatório
                                        </button>
                                    </div>

                                    {pagamentosTemp.length > 0 && (
                                        <div className="mt-8 md:mt-10 animate-[fadeIn_0.5s_ease-out]">
                                            <div className="divide-y divide-zinc-800 border-t border-zinc-700">
                                                {pagamentosTemp.map((p, i) => (
                                                    <div key={i} className="py-4 flex justify-between items-center">
                                                        <div className="flex flex-col">
                                                            <span className="font-bold text-sm md:text-base text-zinc-200">{p.nome}</span>
                                                            <span className="text-xs md:text-sm text-zinc-400">{p.dias} dias validados</span>
                                                        </div>
                                                        <span className="font-bold text-base md:text-lg text-emerald-400">{formatCurrency(p.valor)}</span>
                                                    </div>
                                                ))}
                                                <div className="py-5 md:py-6 flex justify-between items-center bg-zinc-800/20 -mx-5 px-5 md:-mx-8 md:px-8 mt-2 rounded-b-3xl">
                                                    <span className="font-bold text-sm md:text-lg text-zinc-300">TOTAL DA SEMANA</span>
                                                    <span className="font-bold text-xl md:text-2xl text-emerald-400">
                                                        {formatCurrency(pagamentosTemp.reduce((a,b)=>a+b.valor,0))}
                                                    </span>
                                                </div>
                                            </div>
                                            <div className="mt-6 md:mt-8 flex justify-end">
                                                <button onClick={handleRegistrarPagamentos} className="w-full md:w-auto bg-emerald-500 hover:bg-emerald-600 px-6 py-4 rounded-2xl font-bold flex justify-center items-center gap-3 transition shadow-lg shadow-emerald-500/20 text-sm md:text-base">
                                                    <i className="fa-solid fa-check"></i> Oficializar no Banco
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* RELATÓRIOS */}
                        {activeSection === 'relatorios' && (
                            <div className="animate-[fadeIn_0.5s_ease-out] max-w-7xl mx-auto">
                                <h2 className="text-2xl md:text-3xl font-bold mb-6 md:mb-8">Relatórios Financeiros</h2>
                                <div className="bg-zinc-900 rounded-3xl p-5 md:p-8 mb-6 md:mb-8 border border-zinc-800/50 shadow-xl">
                                    <div className="flex flex-col md:flex-row gap-4 md:gap-6 items-end">
                                        <div className="flex-1 w-full">
                                            <label className="block text-zinc-400 text-xs md:text-sm font-medium mb-2">Data Inicial</label>
                                            <input type="date" value={relatorioForm.inicio} onChange={e => setRelatorioForm({...relatorioForm, inicio: e.target.value})} className="w-full bg-zinc-800 border border-zinc-700 rounded-2xl p-4 outline-none focus:border-emerald-500 transition text-sm md:text-base" />
                                        </div>
                                        <div className="flex-1 w-full">
                                            <label className="block text-zinc-400 text-xs md:text-sm font-medium mb-2">Data Final</label>
                                            <input type="date" value={relatorioForm.fim} onChange={e => setRelatorioForm({...relatorioForm, fim: e.target.value})} className="w-full bg-zinc-800 border border-zinc-700 rounded-2xl p-4 outline-none focus:border-emerald-500 transition text-sm md:text-base" />
                                        </div>
                                    </div>
                                </div>

                                <div className="flex overflow-x-auto gap-4 md:grid md:grid-cols-3 md:gap-6 mb-8 pb-2 snap-x hide-scrollbar">
                                    <div className="bg-zinc-900 rounded-3xl p-6 border border-emerald-500/20 shadow-lg relative overflow-hidden min-w-[240px] md:min-w-0 snap-center shrink-0">
                                        <div className="absolute top-0 right-0 p-6 opacity-5"><i className="fa-solid fa-arrow-trend-up text-6xl"></i></div>
                                        <p className="text-zinc-400 text-sm font-medium">Entradas</p>
                                        <p className="text-2xl md:text-3xl font-bold text-emerald-400 mt-2">{formatCurrency(relEntradas)}</p>
                                    </div>
                                    <div className="bg-zinc-900 rounded-3xl p-6 border border-red-500/20 shadow-lg relative overflow-hidden min-w-[240px] md:min-w-0 snap-center shrink-0">
                                        <div className="absolute top-0 right-0 p-6 opacity-5"><i className="fa-solid fa-arrow-trend-down text-6xl"></i></div>
                                        <p className="text-zinc-400 text-sm font-medium">Saídas</p>
                                        <p className="text-2xl md:text-3xl font-bold text-red-400 mt-2">{formatCurrency(relSaidas)}</p>
                                    </div>
                                    <div className={`bg-zinc-900 rounded-3xl p-6 border shadow-lg relative overflow-hidden min-w-[240px] md:min-w-0 snap-center shrink-0 ${relEntradas-relSaidas >= 0 ? 'border-emerald-500/50' : 'border-red-500/50'}`}>
                                        <div className="absolute top-0 right-0 p-6 opacity-5"><i className="fa-solid fa-wallet text-6xl"></i></div>
                                        <p className="text-zinc-400 text-sm font-medium">Saldo Líquido</p>
                                        <p className={`text-2xl md:text-3xl font-bold mt-2 ${relEntradas-relSaidas >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>{formatCurrency(relEntradas - relSaidas)}</p>
                                    </div>
                                </div>

                                <h3 className="font-bold text-lg md:text-xl mb-4 md:mb-6">Detalhamento</h3>
                                <div className="bg-zinc-900 rounded-3xl overflow-hidden border border-zinc-800/50 shadow-xl">
                                    <div className="divide-y divide-zinc-800/50">
                                        {filteredRelatorios.length === 0 && (
                                            <div className="p-8 text-center text-zinc-500 font-medium">Nenhuma movimentação nestas datas.</div>
                                        )}
                                        {filteredRelatorios.map(t => (
                                            <div key={t.id} className="p-4 md:p-6 hover:bg-zinc-800/30 transition flex flex-col md:flex-row md:items-center justify-between gap-3">
                                                <div className="flex flex-col">
                                                    <span className="font-bold text-base text-zinc-200">{t.descricao}</span>
                                                    <span className="text-xs text-zinc-400 mt-1">{formatDate(t.data)}</span>
                                                </div>
                                                <div className="flex items-center justify-between md:justify-end gap-4 w-full md:w-auto">
                                                    <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${t.tipo==='entrada'?'bg-emerald-500/10 text-emerald-400':'bg-red-500/10 text-red-400'}`}>
                                                        {t.tipo.toUpperCase()}
                                                    </span>
                                                    <span className={`font-bold text-base md:text-lg ${t.tipo==='entrada'?'text-emerald-400':'text-red-400'}`}>
                                                        {t.tipo==='entrada' ? '+' : '-'} {formatCurrency(t.valor)}
                                                    </span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* GERENCIAMENTO DE ACESSOS (ADMIN) */}
                        {activeSection === 'usuarios' && user?.is_admin && (
                            <div className="animate-[fadeIn_0.5s_ease-out] max-w-7xl mx-auto">
                                <div className="flex flex-col md:flex-row justify-between md:items-center gap-4 mb-6 md:mb-8">
                                    <div>
                                        <h2 className="text-2xl md:text-3xl font-bold">Gerenciar Acessos</h2>
                                        <p className="text-zinc-400 text-sm mt-1">Aprove ou bloqueie usuários que tentam acessar o sistema.</p>
                                    </div>
                                    <button onClick={loadSystemUsers} className="w-12 h-12 flex items-center justify-center bg-zinc-800 hover:bg-zinc-700 rounded-xl transition text-emerald-400 shadow-md">
                                        <i className="fa-solid fa-rotate-right"></i>
                                    </button>
                                </div>
                                
                                <div className="bg-zinc-900 rounded-3xl overflow-hidden border border-zinc-800/50 shadow-xl">
                                    <div className="divide-y divide-zinc-800/50">
                                        {systemUsers.length === 0 && (
                                            <div className="p-8 text-center text-zinc-500 font-medium">Carregando usuários...</div>
                                        )}
                                        {systemUsers.map(u => (
                                            <div key={u.id} className="p-4 md:p-6 hover:bg-zinc-800/30 transition flex flex-col md:flex-row md:items-center justify-between gap-4">
                                                <div className="flex flex-col flex-1">
                                                    <div className="flex items-center gap-3">
                                                        <span className="font-bold text-base md:text-lg text-zinc-200">{u.nome}</span>
                                                        {u.is_admin && <span className="bg-emerald-500/20 text-emerald-400 text-[10px] px-2 py-0.5 rounded-md font-bold border border-emerald-500/30">ADMIN</span>}
                                                    </div>
                                                    <span className="text-xs md:text-sm text-zinc-400 mt-1"><i className="fa-regular fa-envelope mr-1"></i> {u.email}</span>
                                                </div>
                                                
                                                <div className="flex items-center justify-between md:justify-end gap-4 w-full md:w-auto pt-3 md:pt-0 border-t border-zinc-800/50 md:border-0">
                                                    <span className={`px-3 py-1 rounded-full text-xs font-bold flex items-center gap-2 ${u.aprovado ? 'bg-emerald-500/10 text-emerald-400' : 'bg-amber-500/10 text-amber-400'}`}>
                                                        {u.aprovado ? <><i className="fa-solid fa-check"></i> Liberado</> : <><i className="fa-solid fa-lock"></i> Bloqueado</>}
                                                    </span>
                                                    
                                                    {/* Não permite que o admin bloqueie a si mesmo para evitar trancar o sistema acidentalmente */}
                                                    {user.id !== u.id && (
                                                        <button 
                                                            onClick={() => toggleUserApproval(u.id, u.aprovado)} 
                                                            className={`px-5 py-2 md:py-2.5 rounded-xl text-xs md:text-sm font-bold transition border ${u.aprovado ? 'bg-zinc-800 text-red-400 hover:bg-red-500/20 hover:border-red-500/30 border-transparent' : 'bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600 hover:text-white border-emerald-500/30'}`}
                                                        >
                                                            {u.aprovado ? 'Revogar Acesso' : 'Aprovar Acesso'}
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                    </div>

                    {/* MODALS INSERÇÃO (Adaptados para Mobile) */}
                    {modalType === 'transacao' && (
                        <div className="fixed inset-0 bg-black/80 flex items-end md:items-center justify-center z-[60] p-0 md:p-4">
                            <div className="bg-zinc-900 rounded-t-3xl md:rounded-3xl w-full max-w-md p-6 md:p-8 shadow-2xl border-t md:border border-zinc-700 animate-[slideUp_0.3s_ease-out] md:animate-[fadeIn_0.2s_ease-out] max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-xl font-bold">Nova Transação</h3>
                                    <button onClick={() => setModalType(null)} className="md:hidden text-zinc-400"><i className="fa-solid fa-xmark text-xl"></i></button>
                                </div>
                                <div className="space-y-5">
                                    <div>
                                        <label className="block text-xs md:text-sm text-zinc-400 mb-2 font-medium">Tipo</label>
                                        <div className="flex gap-3">
                                            <button onClick={() => setTransForm({...transForm, tipo: 'entrada'})} className={`flex-1 py-4 md:py-3 rounded-2xl font-bold transition border-2 text-sm md:text-base ${transForm.tipo === 'entrada' ? 'border-emerald-500 text-emerald-400 bg-emerald-500/10' : 'border-zinc-700 hover:border-zinc-600'}`}>Entrada</button>
                                            <button onClick={() => setTransForm({...transForm, tipo: 'saida'})} className={`flex-1 py-4 md:py-3 rounded-2xl font-bold transition border-2 text-sm md:text-base ${transForm.tipo === 'saida' ? 'border-red-500 text-red-400 bg-red-500/10' : 'border-zinc-700 hover:border-zinc-600'}`}>Saída</button>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs md:text-sm text-zinc-400 mb-2 font-medium">Data</label>
                                        <input type="date" value={transForm.data} onChange={e => setTransForm({...transForm, data: e.target.value})} className="w-full bg-zinc-800 border border-zinc-700 rounded-2xl p-4 outline-none focus:border-emerald-500 transition text-base" />
                                    </div>
                                    <div>
                                        <label className="block text-xs md:text-sm text-zinc-400 mb-2 font-medium">Descrição</label>
                                        <input type="text" value={transForm.desc} onChange={e => setTransForm({...transForm, desc: e.target.value})} className="w-full bg-zinc-800 border border-zinc-700 rounded-2xl p-4 outline-none focus:border-emerald-500 transition text-base" placeholder="Ex: Venda de produto" />
                                    </div>
                                    <div>
                                        <label className="block text-xs md:text-sm text-zinc-400 mb-2 font-medium">Valor (R$)</label>
                                        <input type="number" step="0.01" value={transForm.valor} onChange={e => setTransForm({...transForm, valor: e.target.value})} className="w-full bg-zinc-800 border border-zinc-700 rounded-2xl p-4 outline-none focus:border-emerald-500 transition text-base" placeholder="0,00" />
                                    </div>
                                </div>
                                <div className="flex flex-col md:flex-row gap-3 md:gap-4 mt-8">
                                    <button onClick={() => setModalType(null)} className="hidden md:block flex-1 py-4 bg-zinc-800 hover:bg-zinc-700 rounded-2xl font-bold transition">Cancelar</button>
                                    <button onClick={saveTransacao} className="w-full md:flex-1 py-4 bg-emerald-500 hover:bg-emerald-600 rounded-2xl font-bold shadow-lg shadow-emerald-500/20 transition text-lg md:text-base mb-2 md:mb-0">Salvar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {modalType === 'conta' && (
                        <div className="fixed inset-0 bg-black/80 flex items-end md:items-center justify-center z-[60] p-0 md:p-4">
                            <div className="bg-zinc-900 rounded-t-3xl md:rounded-3xl w-full max-w-md p-6 md:p-8 shadow-2xl border-t md:border border-zinc-700 animate-[slideUp_0.3s_ease-out] md:animate-[fadeIn_0.2s_ease-out] max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-xl font-bold">Nova Conta a Pagar</h3>
                                    <button onClick={() => setModalType(null)} className="md:hidden text-zinc-400"><i className="fa-solid fa-xmark text-xl"></i></button>
                                </div>
                                <div className="space-y-5">
                                    <div>
                                        <label className="block text-xs md:text-sm text-zinc-400 mb-2 font-medium">Descrição</label>
                                        <input type="text" value={contaForm.desc} onChange={e => setContaForm({...contaForm, desc: e.target.value})} className="w-full bg-zinc-800 border border-zinc-700 rounded-2xl p-4 outline-none focus:border-emerald-500 transition text-base" placeholder="Ex: Aluguel" />
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                        <div>
                                            <label className="block text-xs md:text-sm text-zinc-400 mb-2 font-medium">Valor</label>
                                            <input type="number" step="0.01" value={contaForm.valor} onChange={e => setContaForm({...contaForm, valor: e.target.value})} className="w-full bg-zinc-800 border border-zinc-700 rounded-2xl p-4 outline-none focus:border-emerald-500 transition text-base" placeholder="0,00" />
                                        </div>
                                        <div>
                                            <label className="block text-xs md:text-sm text-zinc-400 mb-2 font-medium">Vencimento</label>
                                            <input type="date" value={contaForm.vencimento} onChange={e => setContaForm({...contaForm, vencimento: e.target.value})} className="w-full bg-zinc-800 border border-zinc-700 rounded-2xl p-4 outline-none focus:border-emerald-500 transition text-base" />
                                        </div>
                                    </div>
                                </div>
                                <div className="flex flex-col md:flex-row gap-3 md:gap-4 mt-8">
                                    <button onClick={() => setModalType(null)} className="hidden md:block flex-1 py-4 bg-zinc-800 hover:bg-zinc-700 rounded-2xl font-bold transition">Cancelar</button>
                                    <button onClick={saveConta} className="w-full md:flex-1 py-4 bg-emerald-500 hover:bg-emerald-600 rounded-2xl font-bold shadow-lg shadow-emerald-500/20 transition text-lg md:text-base mb-2 md:mb-0">Salvar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {modalType === 'funcionario' && (
                        <div className="fixed inset-0 bg-black/80 flex items-end md:items-center justify-center z-[60] p-0 md:p-4">
                            <div className="bg-zinc-900 rounded-t-3xl md:rounded-3xl w-full max-w-md p-6 md:p-8 shadow-2xl border-t md:border border-zinc-700 animate-[slideUp_0.3s_ease-out] md:animate-[fadeIn_0.2s_ease-out] max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-xl font-bold">Novo Funcionário</h3>
                                    <button onClick={() => setModalType(null)} className="md:hidden text-zinc-400"><i className="fa-solid fa-xmark text-xl"></i></button>
                                </div>
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-xs md:text-sm text-zinc-400 mb-1 font-medium">Nome Completo *</label>
                                        <input type="text" value={funcForm.nome} onChange={e => setFuncForm({...funcForm, nome: e.target.value})} className="w-full bg-zinc-800 border border-zinc-700 rounded-2xl p-3 outline-none focus:border-emerald-500 transition text-sm md:text-base" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs md:text-sm text-zinc-400 mb-1 font-medium">CPF</label>
                                            <input type="text" value={funcForm.cpf} onChange={e => setFuncForm({...funcForm, cpf: e.target.value})} className="w-full bg-zinc-800 border border-zinc-700 rounded-2xl p-3 outline-none focus:border-emerald-500 transition text-sm md:text-base" placeholder="000.000.000-00" />
                                        </div>
                                        <div>
                                            <label className="block text-xs md:text-sm text-zinc-400 mb-1 font-medium">Nascimento</label>
                                            <input type="date" value={funcForm.data_nascimento} onChange={e => setFuncForm({...funcForm, data_nascimento: e.target.value})} className="w-full bg-zinc-800 border border-zinc-700 rounded-2xl p-3 outline-none focus:border-emerald-500 transition text-sm md:text-base" />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs md:text-sm text-zinc-400 mb-1 font-medium">Telefone</label>
                                            <input type="text" value={funcForm.telefone} onChange={e => setFuncForm({...funcForm, telefone: e.target.value})} className="w-full bg-zinc-800 border border-zinc-700 rounded-2xl p-3 outline-none focus:border-emerald-500 transition text-sm md:text-base" placeholder="(00) 90000-0000" />
                                        </div>
                                        <div>
                                            <label className="block text-xs md:text-sm text-zinc-400 mb-1 font-medium">Cargo</label>
                                            <input type="text" value={funcForm.cargo} onChange={e => setFuncForm({...funcForm, cargo: e.target.value})} className="w-full bg-zinc-800 border border-zinc-700 rounded-2xl p-3 outline-none focus:border-emerald-500 transition text-sm md:text-base" placeholder="Ex: Vendedor" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs md:text-sm text-zinc-400 mb-1 font-medium">Endereço Completo</label>
                                        <input type="text" value={funcForm.endereco} onChange={e => setFuncForm({...funcForm, endereco: e.target.value})} className="w-full bg-zinc-800 border border-zinc-700 rounded-2xl p-3 outline-none focus:border-emerald-500 transition text-sm md:text-base" placeholder="Rua, Número, Bairro, Cidade" />
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs md:text-sm text-zinc-400 mb-1 font-medium">Chave PIX / Conta</label>
                                            <input type="text" value={funcForm.dados_bancarios} onChange={e => setFuncForm({...funcForm, dados_bancarios: e.target.value})} className="w-full bg-zinc-800 border border-zinc-700 rounded-2xl p-3 outline-none focus:border-emerald-500 transition text-sm md:text-base" placeholder="CPF, Celular..." />
                                        </div>
                                        <div>
                                            <label className="block text-xs md:text-sm text-zinc-400 mb-1 font-medium">Salário Diário (R$) *</label>
                                            <input type="number" step="0.01" value={funcForm.salario} onChange={e => setFuncForm({...funcForm, salario: e.target.value})} className="w-full bg-zinc-800 border border-zinc-700 rounded-2xl p-3 outline-none focus:border-emerald-500 transition text-sm md:text-base" placeholder="0,00" />
                                        </div>
                                    </div>
                                </div>
                                <div className="flex flex-col md:flex-row gap-3 md:gap-4 mt-6">
                                    <button onClick={() => setModalType(null)} className="hidden md:block flex-1 py-4 bg-zinc-800 hover:bg-zinc-700 rounded-2xl font-bold transition">Cancelar</button>
                                    <button onClick={saveFuncionario} className="w-full md:flex-1 py-4 bg-emerald-500 hover:bg-emerald-600 rounded-2xl font-bold shadow-lg shadow-emerald-500/20 transition text-lg md:text-base mb-2 md:mb-0">Salvar Dados</button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <style>
        /* Animações CSS p/ melhor UX no celular */
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</body>
</html>
